version: 2
updates:
  # Keeps pinned dependencies and workflow actions current via reviewable PRs.
  - package-ecosystem: pip
    directory: /services/user-service
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/user-service
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /services/product-service
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/product-service
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/order-service
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/order-service
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/payment-service
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/payment-service
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "react-router-dom", "@types/react*"]
      tooling:
        patterns: ["vite", "vitest", "@vitest/*", "eslint*", "typescript*", "@typescript-eslint/*"]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /services/notification-service
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/notification-service
    schedule:
      interval: weekly
