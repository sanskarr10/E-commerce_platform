name: notification-service

# Path filter: this pipeline only runs when the service (or this file) changes.
on:
  push:
    branches: [main]
    paths:
      - "services/notification-service/**"
      - "docs/events/**"
      - ".github/workflows/notification-service.yml"
  pull_request:
    paths:
      - "services/notification-service/**"
      - "docs/events/**"
      - ".github/workflows/notification-service.yml"

permissions:
  contents: read

concurrency:
  group: notification-service-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/notification-service

jobs:
  test:
    name: Lint, unit and integration tests
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL: the unique-per-order key, the email claim lease and the concurrency tests run here.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/notification-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (coverage gate)
        run: npm run test:coverage

      - name: Integration tests against real PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/notifications_test
        run: npm run test:integration

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  scan:
    name: Build image and scan for vulnerabilities
    needs: test
    runs-on: ubuntu-latest
    # No secrets and no package-write permission here: the scanner is third-party code.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: services/notification-service
          load: true
          tags: notification-service:ci
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,scope=notification-service,mode=max

      # SUPPLY-CHAIN NOTE: see the same step in user-service.yml. trivy-action tags up to 0.34.2
      # were compromised in March 2026 (GHSA-69fq-xp46-6x23). Pin a reviewed commit SHA when you can.
      - name: Trivy scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.69.3
          image-ref: notification-service:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Push image to GHCR
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lower-case image names.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecommerce-notification-service" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/notification-service
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=notification-service
