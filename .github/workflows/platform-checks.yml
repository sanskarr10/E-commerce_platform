name: platform-checks

# Validates everything that is not a single service: shell scripts, Compose, gateway config.
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "deploy/**"
      - "gateway/**"
      - ".env.example"
      - ".github/workflows/platform-checks.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "deploy/**"
      - "gateway/**"
      - ".env.example"
      - ".github/workflows/platform-checks.yml"

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck (preinstalled on GitHub runners)
        run: shellcheck scripts/*.sh

      - name: Compose file is valid
        run: docker compose --env-file .env.example -f deploy/docker-compose.yml config --quiet

      - name: Gateway config passes nginx -t
        run: |
          docker run --rm -e NGINX_RESOLVER=127.0.0.11 \
            -v "$PWD/gateway/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.27-alpine sh -c \
            'envsubst "\$NGINX_RESOLVER" < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -t'

      - name: Prometheus config, alert rules and alert unit tests pass promtool
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 -c \
            'promtool check config /etc/prometheus/prometheus.yml && promtool check rules /etc/prometheus/alerts.yml && cd /etc/prometheus && promtool test rules alerts.test.yml'

      - name: Grafana dashboards are valid JSON
        run: for f in deploy/observability/grafana/dashboards/*.json; do jq empty "$f"; done
