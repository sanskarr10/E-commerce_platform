name: product-service

# Path filter: this pipeline only runs when the service (or this file) changes.
on:
  push:
    branches: [main]
    paths:
      - "services/product-service/**"
      - "docs/events/**"
      - ".github/workflows/product-service.yml"
  pull_request:
    paths:
      - "services/product-service/**"
      - "docs/events/**"
      - ".github/workflows/product-service.yml"

permissions:
  contents: read

concurrency:
  group: product-service-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/product-service

jobs:
  test:
    name: Lint, unit and integration tests
    runs-on: ubuntu-latest
    services:
      # Real MySQL, Redis and RabbitMQ: this is where the oversell-race, inbox/outbox and
      # retry/dead-letter tests run.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: catalog_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/product-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (coverage gate)
        run: npm run test:coverage

      - name: Integration tests against real MySQL, Redis and RabbitMQ
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_DATABASE: catalog_test
          REDIS_URL: redis://127.0.0.1:6379
          RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
        run: npm run test:integration

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  scan:
    name: Build image and scan for vulnerabilities
    needs: test
    runs-on: ubuntu-latest
    # No secrets and no package-write permission here: the scanner is third-party code.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: services/product-service
          load: true
          tags: product-service:ci
          cache-from: type=gha,scope=product-service
          cache-to: type=gha,scope=product-service,mode=max

      # SUPPLY-CHAIN NOTE: see the same step in user-service.yml. trivy-action tags up to 0.34.2
      # were compromised in March 2026 (GHSA-69fq-xp46-6x23). Pin a reviewed commit SHA when you can.
      - name: Trivy scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          image-ref: product-service:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Push image to GHCR
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lower-case image names.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecommerce-product-service" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/product-service
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=product-service
