# Prometheus scrapes every service's /metrics over the internal Docker network.
# The gateway never routes /metrics, so these endpoints are not reachable from outside.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: user-service
    static_configs: [{ targets: ["user-service:8000"] }]
  - job_name: order-service
    static_configs: [{ targets: ["order-service:8000"] }]
  - job_name: payment-service
    static_configs: [{ targets: ["payment-service:8000"] }]
  - job_name: product-service
    static_configs: [{ targets: ["product-service:3000"] }]
  - job_name: notification-service
    static_configs: [{ targets: ["notification-service:3100"] }]
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
