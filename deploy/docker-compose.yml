# Run from the repo root:  make up   (or: docker compose --env-file .env -f deploy/docker-compose.yml up --build)
name: ecommerce

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catalog}
      MYSQL_USER: ${MYSQL_USER:?set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set in .env}
    ports:
      - "127.0.0.1:15672:15672" # management UI, localhost only
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro # adds the Prometheus plugin
      - ./observability/rabbitmq/prometheus.conf:/etc/rabbitmq/conf.d/90-prometheus.conf:ro # per-queue metrics
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  user-service:
    build: ../services/user-service
    # Migrations run before the app starts. In Kubernetes this becomes a Helm pre-upgrade Job.
    # `exec` makes the server PID 1 so it receives SIGTERM and shuts down gracefully.
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/users_db
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./keys:/run/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s # migrations run before the app starts
    restart: unless-stopped

  product-service:
    build: ../services/product-service
    # Migrations run before the app starts. In Kubernetes this becomes a Helm pre-upgrade Job.
    command: sh -c "node src/migrate.js && exec node src/server.js"
    environment:
      NODE_ENV: production
      PORT: "3000"
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catalog}
      MYSQL_USER: ${MYSQL_USER:?set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
    volumes:
      # Only the PUBLIC key: this service can verify tokens but can never mint them.
      - ./keys/jwt_public.pem:/run/keys/jwt_public.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s # migrations run before the app starts
    restart: unless-stopped

  order-service:
    build: ../services/order-service
    # Migrations run before the app starts. In Kubernetes this becomes a Helm pre-upgrade Job.
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orders_db
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      PRODUCT_SERVICE_URL: http://product-service:3000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
    volumes:
      - ./keys/jwt_public.pem:/run/keys/jwt_public.pem:ro # public key only
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s # migrations run before the app starts
    restart: unless-stopped

  payment-service:
    build: ../services/payment-service
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payments_db
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
    volumes:
      - ./keys/jwt_public.pem:/run/keys/jwt_public.pem:ro # public key only
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s # migrations run before the app starts
    restart: unless-stopped

  notification-service:
    build: ../services/notification-service
    # The image runs migrations (and creates notifications_db if an older volume lacks it), then starts.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notifications_db
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: "Shop <no-reply@shop.local>"
    volumes:
      - ./keys/jwt_public.pem:/run/keys/jwt_public.pem:ro # public key only
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mailpit:
    # A fake SMTP server with a web inbox: every email the shop "sends" lands here, nothing leaves your machine.
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025" # inbox UI, localhost only
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    environment:
      NGINX_RESOLVER: 127.0.0.11 # Docker's embedded DNS
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ../gateway/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  storefront:
    build:
      context: ../frontend
      args:
        APP: storefront
    ports:
      - "${STOREFRONT_PORT:-8081}:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ../frontend
      args:
        APP: admin
    ports:
      - "${ADMIN_PORT:-8082}:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090" # localhost only
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000" # localhost only
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
  rabbitmq-data:
